services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: widgetplatform
      POSTGRES_PASSWORD: widgetplatform
      POSTGRES_DB: widgetplatform
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U widgetplatform']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_CLIENT: pg
      PGHOST: db
      PGPORT: 5432
      PGUSER: widgetplatform
      PGPASSWORD: widgetplatform
      PGDATABASE: widgetplatform
      JWT_SECRET: change-this-in-any-real-deployment
      GEO_MODE: mock
      PUBLIC_BASE_URL: http://localhost:3000
      ADMIN_ORIGIN: '*'

volumes:
  db_data:
